<h3>Yeni Kategori Oluştur</h3>



<form (submit)="create()">
  <label>Kategori Adı</label>
  <input type="text" name="name" [(ngModel)]="category.name" class="form-control" required>
  <br>
  <button class="btn btn-outline-dark">Kaydet</button>
</form>

<a routerLink="/admin/categories" class="btn btn-secondary offset-2">İptal</a>
